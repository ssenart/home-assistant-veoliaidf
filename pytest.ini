[pytest]
# Live tests log into the Veolia web site, so they are deselected by default. Run them with: pytest -m live
addopts = -m "not live"
markers =
    live: logs into the Veolia web site (needs VEOLIAIDF_USERNAME and VEOLIAIDF_PASSWORD)
log_level = DEBUG
log_format = %(asctime)s %(levelname)s [%(name)s] %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
log_cli_level = DEBUG
log_cli = True
log_cli_format = %(asctime)s %(levelname)s [%(name)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file_level = DEBUG
log_file_format = %(asctime)s %(levelname)s [%(name)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
log_file = log/pytest.log
