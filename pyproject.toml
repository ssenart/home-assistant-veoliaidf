[project]
name = "home-assistant-veoliaidf"
# Kept in step with custom_components/veoliaidf/manifest.json. Not published.
version = "0.4.2"
description = "VeoliaIDF custom component for Home Assistant"
# Home Assistant itself requires Python 3.14.2 or newer.
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "flake8",
    "homeassistant",
    # The asynchronous library, which needs no browser. It is taken from the sibling checkout (see tool.uv.sources)
    # until 0.5.0 is on PyPI: then pin it there and remove the source.
    "pyveoliaidf",
    "pytest",
    "pytest-asyncio",
]

[tool.uv.sources]
pyveoliaidf = { path = "../PyVeoliaIDF", editable = true }

[tool.uv]
# This is a Home Assistant custom component, not a package to publish.
package = false
