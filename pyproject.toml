[project]
name = "home-assistant-veoliaidf"
# Kept in step with custom_components/veoliaidf/manifest.json. Not published.
version = "0.4.2"
description = "VeoliaIDF custom component for Home Assistant"
# Home Assistant itself requires Python 3.14.2 or newer.
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "flake8",
    "homeassistant",
    # The asynchronous library, which needs no browser. A pre-release from PyPI, pinned exactly like the requirement
    # of custom_components/veoliaidf/manifest.json. Move both to >=0.5.0 once 0.5.0 is final.
    "pyveoliaidf==0.5.0a1",
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
# This is a Home Assistant custom component, not a package to publish.
package = false
